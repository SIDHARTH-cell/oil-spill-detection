<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060c16" />
    <meta
      name="description"
      content="Maritime Fleet Operator Compliance Portal — Review Satellite Oil Spill Warnings & AIS Evidence Served by Coast Guard."
    />
    <title>Fleet Compliance Portal — Satellite Oil Spill Warning & AIS Attribution</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="employee.css?v=6" />

    <!-- Leaflet 1.9.4 CSS (Third-Party Interactive GIS Map Service) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <!-- Top System Header Bar: Fleet Compliance Portal -->
    <header class="app-header">
      <div class="header-right">
        <!-- Submit Explanation / Dispute Button -->
        <button type="button" id="open-complaint-btn" class="btn-complaint">
          <svg viewBox="0 0 20 20" fill="currentColor" class="btn-icon">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          <span>Submit Explanation / Dispute</span>
        </button>

        <!-- Logged-in Operator Profile (Recipient of Warning) -->
        <div class="user-badge">
          <div class="user-avatar">FO</div>
          <div class="user-info">
            <span class="user-name" id="display-user-name">Rajesh Sharma</span>
            <span class="user-role">Fleet Operations &amp; Compliance</span>
          </div>
        </div>

        <!-- Exit Link -->
        <a href="login.html" class="btn-logout" title="Sign out to login">
          <svg viewBox="0 0 20 20" fill="currentColor" class="btn-icon">
            <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd" />
          </svg>
          <span>Exit</span>
        </a>
      </div>
    </header>

    <!-- Main Workspace: Split View (Left Geographic Map of India, Right Warning Review Console) -->
    <div class="workspace-container" id="workspace-container">
      <!-- ===================================================================
           LEFT PANEL: Geographic Maritime Map (India & Indian Ocean Basins)
           =================================================================== -->
      <aside class="tactical-map-panel" id="tactical-map-panel">
        <button
          type="button"
          id="close-map-dashboard"
          class="map-dashboard-close"
        >
          Back to Review
        </button>
        <!-- Third-Party Interactive GIS Map Container (Leaflet.js) -->
        <div class="map-canvas-wrapper" id="map-canvas-wrapper">
          <div id="tactical-leaflet-map" aria-label="Interactive Tactical GIS Map"></div>
          <div id="streamlit-dashboard-container">

          <button
              id="close-streamlit-dashboard"
              type="button"
          >
              Back to Map
          </button>

          <iframe
              id="streamlit-dashboard-frame"
              src="http://127.0.0.1:8501/?embed=true"
              title="Oil Spill Source Tracing Dashboard"
          ></iframe>

        </div>
        </div>

        <!-- Floating Map Telemetry Bar -->
        <div class="map-footer-telemetry" id="map-footer-telemetry">
          <span class="coord-label">LAT 19&deg;28.4'N &bull; LON 71&deg;52.1'E</span>
          <span class="zone-label">BOMBAY HIGH BASIN &bull; ARABIAN SEA</span>
        </div>
      </aside>

      <!-- ===================================================================
           RIGHT PANEL: Warning Review & Evidence Dossier Console
           =================================================================== -->
      <main class="search-panel" id="search-panel">
        <div class="search-scrollable-content">
          <!-- Page Header: Recipient of Coast Guard Violation Notice -->
          <div class="console-hero">
            <h1 class="console-title">Review Coast Guard Oil Spill Attribution Notice</h1>
          </div>

          <!-- Notice Filter & Lookup Form -->
          <form id="attribution-search-form" class="attribution-form" autocomplete="off">
            <div class="form-grid">
              <!-- Field 1: Company Name -->
              <div class="form-group">
                <label for="input-company" class="form-label">
                  <span>Shipping Company / Fleet Operator</span>
                  <span class="req">*</span>
                </label>
                <div class="input-box">
                  <span class="box-icon">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 110 2h-3a1 1 0 01-1-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 01-1 1H4a1 1 0 110-2V4zm3 1h2v2H7V5zm2 4H7v2h2V9zm2-4h2v2h-2V5zm2 4h-2v2h2V9z" clip-rule="evenodd" />
                    </svg>
                  </span>
                  <input
                    type="text"
                    id="input-company"
                    class="form-input"
                    placeholder="e.g., Bharat Shipping Corp"
                    value="Bharat Shipping Corp"
                    required
                  />
                </div>
              </div>

              <!-- Field 2: Employee Name -->
              <div class="form-group">
                <label for="input-employee" class="form-label">
                  <span>Authorized Compliance Manager / Officer</span>
                  <span class="req">*</span>
                </label>
                <div class="input-box">
                  <span class="box-icon">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                    </svg>
                  </span>
                  <input
                    type="text"
                    id="input-employee"
                    class="form-input"
                    placeholder="e.g., Rajesh Sharma"
                    value="Rajesh Sharma"
                    required
                  />
                </div>
              </div>

              <!-- Field 3: Ship Number / IMO (Optional) -->
              <div class="form-group">
                <label for="input-ship" class="form-label">
                  <span>Vessel IMO / Registration Number</span>
                  <span class="opt">(Optional — Leave blank to inspect all company vessels)</span>
                </label>
                <div class="input-box">
                  <span class="box-icon">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                      <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
                    </svg>
                  </span>
                  <input
                    type="text"
                    id="input-ship"
                    class="form-input"
                    placeholder="e.g., IMO 9412351 (or blank for entire company)"
                    value="IMO 9412351"
                  />
                </div>
              </div>

              <!-- Field 4: Maritime Zone -->
              <div class="form-group">
                <label for="select-zone" class="form-label">
                  <span>Incident Surveillance Sector</span>
                </label>
                <div class="input-box">
                  <span class="box-icon">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
                    </svg>
                  </span>
                  <select id="select-zone" class="form-select">
                    <option value="Arabian Sea (Sector 4 - Bombay High Offshore)" selected>
                      Arabian Sea (Sector 4 - Bombay High Offshore)
                    </option>
                    <option value="Gulf of Kutch (Jamnagar Refinery Transit Lane)">
                      Gulf of Kutch (Jamnagar Refinery Transit Lane)
                    </option>
                    <option value="Bay of Bengal (Paradip - Sagar Island Sector)">
                      Bay of Bengal (Paradip - Sagar Island Sector)
                    </option>
                    <option value="Indian Ocean Major Shipping Corridor (SLOC)">
                      Indian Ocean Major Shipping Corridor (SLOC)
                    </option>
                  </select>
                </div>
              </div>

              <!-- Field 5: Timeframe Window -->
              <div class="form-group">
                <label for="select-timeframe" class="form-label">
                  <span>Satellite Acquisition &amp; Notice Window</span>
                </label>
                <div class="input-box">
                  <span class="box-icon">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
                    </svg>
                  </span>
                  <select id="select-timeframe" class="form-select">
                    <option value="24h" selected>Last 24 Hours (Sentinel-1 SAR C-Band Pass)</option>
                    <option value="48h">Last 48 Hours (Multi-Constellation Blend)</option>
                    <option value="7d">Historical Incident Archive (Past 7 Days)</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Submit Action -->
            <div class="form-actions-bar">
              <button type="button" id="btn-run-search" class="btn-search-primary">
                <svg viewBox="0 0 20 20" fill="currentColor" class="btn-icon">
                  <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                </svg>
                <span>INSPECT NOTICE &amp; SATELLITE EVIDENCE (EXPAND MAP)</span>
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <!-- Leaflet 1.9.4 Library (Third-Party Interactive GIS Map Engine) -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- Script -->
    <script src="employee.js?v=4"></script>
  </body>
</html>
